name: Daily Analysis & Risk Assessment

on:
  schedule:
    # 每個交易日 (週一至週五) 下午 14:00 UTC (台灣時間 22:00) 執行
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # 允許手動觸發

# ⚠️ 關鍵：賦予 Workflow 寫入 Repository 的權限
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  FINMIND_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 必須保留憑證，後續才能 Push
        with:
          persist-credentials: true 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Analysis (Full Mode)
        run: |
          python -m src.main --mode full   # ✅ 跑一次即可，內部會自動生成靜態報告
          python -m src.setup_detector || echo "⚠️ setup detector 失敗"
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run Market Advisor
        run: |
          python -m src.market_advisor || echo "⚠️ advisor 失敗（不中斷主流程）"

      # ❌ 已刪除重複的 Generate Static Review Report 步驟（避免每天執行兩次分析）

      - name: Validate telemetry.json before commit
        run: |
          if [ -f data/telemetry.json ]; then
            python3 -c "import json; json.load(open('data/telemetry.json'))" && \
              echo "✅ telemetry.json 格式正確" || \
              (echo "❌ telemetry.json 格式錯誤！" && head -5 data/telemetry.json && exit 1)
          fi

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 分開處理，避免一個文件失敗影響其他
          [ -f data/telemetry.json ] && git add data/telemetry.json || echo "⚠️ 無 telemetry.json"
          [ -f data/performance_metrics.json ] && git add data/performance_metrics.json || echo "⚠️ 無 performance_metrics.json"
          [ -f docs/latest_report.html ] && git add docs/latest_report.html || echo "⚠️ 無 latest_report.html"
          [ -f docs/latest_review.md ] && git add docs/latest_review.md || echo "⚠️ 無 latest_review.md"
          [ -f data/advice.json ] && git add data/advice.json || echo "⚠️ 無 advice.json"
          
          git commit -m "🎯 Auto update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Upload Analysis Results (Backup)
        uses: actions/upload-artifact@v4
        if: failure()        # 🔴 P1 修正：僅失敗時上傳 log，成功時不佔空間
        with:
          name: analysis-results-${{ github.run_id }}
          path: |
            results/*.json
            logs/*.log
          retention-days: 7
