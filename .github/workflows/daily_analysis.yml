name: Daily Analysis & Risk Assessment

on:
  schedule:
    # 每個交易日 (週一至週五) 下午 14:00 UTC (台灣時間 22:00) 執行
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # 允許手動觸發

# ⚠️ 關鍵：賦予 Workflow 寫入 Repository 的權限
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  FINMIND_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # 必須保留憑證，後續才能 Push
        with:
          persist-credentials: true 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Analysis (Full Mode)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}   # 🆕 第三層財報 fallback（免費 25 次/日，配額管控見 src/financial_cache.py）
        run: |
          python -m src.main --mode full   # ✅ 跑一次即可，內部會自動生成靜態報告
          python -m src.setup_detector || echo "⚠️ setup detector 失敗"

      - name: Run Market Advisor
        run: |
          python -m src.market_advisor || echo "⚠️ advisor 失敗（不中斷主流程）"

      # 🌍 宏觀資產配置引擎（Macro Allocator）：產出 data/macro_allocation.json 供前端 loadMacro() 讀取。
      #    失敗不中斷主流程；regime 狀態檔 macro_regime_state.json 屬本地髒檔，已在 .gitignore 排除、不回 commit。
      - name: Run Macro Allocator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m src.macro_allocator || echo "⚠️ macro allocator 失敗（不中斷主流程）"

      # ❌ 已刪除重複的 Generate Static Review Report 步驟（避免每天執行兩次分析）

      - name: Validate telemetry.json before commit
        run: |
          if [ -f data/telemetry.json ]; then
            python3 -c "import json; json.load(open('data/telemetry.json'))" && \
              echo "✅ telemetry.json 格式正確" || \
              (echo "❌ telemetry.json 格式錯誤！" && head -5 data/telemetry.json && exit 1)
          fi

      - name: Commit and Push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 分開處理，避免一個文件失敗影響其他
          [ -f data/telemetry.json ] && git add data/telemetry.json || echo "⚠️ 無 telemetry.json"
          [ -f data/performance_metrics.json ] && git add data/performance_metrics.json || echo "⚠️ 無 performance_metrics.json"
          [ -f docs/latest_report.html ] && git add docs/latest_report.html || echo "⚠️ 無 latest_report.html"
          [ -f docs/latest_review.md ] && git add docs/latest_review.md || echo "⚠️ 無 latest_review.md"
          [ -f data/advice.json ] && git add data/advice.json || echo "⚠️ 無 advice.json"
          # 🔴 P0 修正：deep_analysis.json（含 trading_plan 買賣點）與 setup_watchlist.json 必須一併發布，
          #    否則前端 renderActionGuide 收到 undefined → 價格地圖／賣的策略卡片消失
          [ -f data/deep_analysis.json ] && git add data/deep_analysis.json || echo "⚠️ 無 deep_analysis.json"
          [ -f data/setup_watchlist.json ] && git add data/setup_watchlist.json || echo "⚠️ 無 setup_watchlist.json"
          # 🔴 Alpha Vantage Fallback：財報快取必須 commit 回 repo——Actions runner 免洗，
          #    不推回 repo 的話每天冷啟動、天天燒 AV 配額（免費版僅 25 次/日）
          [ -f data/financial_cache.json ] && git add data/financial_cache.json || echo "⚠️ 無 financial_cache.json"
          # 🌍 Macro Allocator 輸出：macro_allocation.json 必須 tracked——前端 loadMacro() 直接 fetch 此檔，
          #    不 commit 回 repo 的話 Pages 永遠顯示「尚無宏觀配置資料」
          [ -f data/macro_allocation.json ] && git add data/macro_allocation.json || echo "⚠️ 無 macro_allocation.json"
          # 🆕（#166）確保價值淘金引擎的產出被 commit——前端 loadValueScreener() 與
          #    market_advisor 資產搬家引擎都直接依賴此檔，漏 commit 會導致儀表板 404
          [ -f data/value_candidates.json ] && git add data/value_candidates.json || echo "⚠️ 無 value_candidates.json"

          git commit -m "🎯 Auto update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Upload Analysis Results (Backup)
        uses: actions/upload-artifact@v4
        if: failure()        # 🔴 P1 修正：僅失敗時上傳 log，成功時不佔空間
        with:
          name: analysis-results-${{ github.run_id }}
          path: |
            results/*.json
            logs/*.log
          retention-days: 7
