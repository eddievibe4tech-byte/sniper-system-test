name: Daily US Momentum Analysis (美股動能)

on:
  schedule:
    # 美股收盤後：UTC 22:00 ≈ 台北次日 06:00（夏令）/ 05:00（冬令），週一至週五
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  us-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:          # ⚠️ 不可省略（上次的教訓）
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run US Screener
        run: |
          cd src
          python us_screener.py

          if [ ! -f ../data/us_candidates.json ]; then
            echo "❌ US screener failed to produce file"
            exit 1
          fi
          COUNT=$(python -c "import json; print(len(json.load(open('../data/us_candidates.json')).get('candidates', [])))")
          echo "🇺🇸 美股候選數量：$COUNT"

      - name: Refresh Market Advisor
        run: |
          cd src
          python market_advisor.py || echo "⚠️ advisor 失敗（不阻斷）"

      - name: Commit and Push results
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          [ -f data/us_candidates.json ] && git add data/us_candidates.json || echo "⚠️ 無 us_candidates.json"
          [ -f data/advice.json ] && git add data/advice.json || echo "⚠️ 無 advice.json"
          git commit -m "🇺🇸 Daily US Analysis: $(date +'%Y-%m-%d')" || echo "No changes to commit"

          # ⚠️ 防競態：其他 workflow（如 Daily Crypto）可能在跑此步驟前推了 main，
          # 直接 push 會被拒絕（fetch first）。先 rebase 同步遠端最新再推送，並帶重試。
          for i in 1 2 3; do
            if git pull --rebase "$PUSH_URL" main; then
              if git push "$PUSH_URL" HEAD:main; then
                echo "✅ Push 成功（第 $i 次嘗試）"
                exit 0
              fi
            else
              # rebase 衝突（雙方都改了同一個 JSON）：以本次分析結果為準重新提交
              echo "⚠️ rebase 衝突（第 $i 次），改用 ours 策略保留本次分析結果..."
              git rebase --abort || true
              git fetch "$PUSH_URL" main
              git reset --hard FETCH_HEAD
              git checkout ORIG_HEAD -- data/us_candidates.json data/advice.json 2>/dev/null || true
              git add data/us_candidates.json data/advice.json 2>/dev/null || true
              git diff --cached --quiet || git commit -m "🇺🇸 Daily US Analysis (rebase-ours): $(date +'%Y-%m-%d')"
            fi
            sleep $((i * 5))
          done
          echo "❌ 多次重試後仍無法推送"
          exit 1
