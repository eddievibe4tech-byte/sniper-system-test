name: Weekly Alpha Screener (週末海選)

on:
  schedule:
    # 每週五晚上 19:00 (台北時間 = UTC+8) 執行海選
    - cron: '0 11 * * 5' 
  workflow_dispatch:

# ⚠️ 關鍵：GitHub Actions 自 2024/12 起 GITHUB_TOKEN 預設為唯讀，
# 必須顯式宣告寫入權限，否則 Commit Candidates 步驟的 git push 會返回 exit 128
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install duckduckgo-search pandas
      
      - name: Run Screener & AI Due Diligence
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN || secrets.FINMIND_API_TOKEN || secrets.FINMIND_API_KEY }}
        run: |
          cd src
          python screener.py
          
          # 🟡 修正：檢查檔案是否存在（不論是否為空）
          if [ ! -f ../data/screener_candidates.json ]; then
            echo "❌ Screener failed to produce file"
            exit 1
          fi
          
          # 檢查候選股數量
          CANDIDATE_COUNT=$(python -c "import json; print(len(json.load(open('../data/screener_candidates.json')).get('candidates', [])))")
          echo "📊 候選股數量：$CANDIDATE_COUNT"
          
          if [ "$CANDIDATE_COUNT" -eq 0 ]; then
            echo "⚠️ 本週無符合條件的候選股（市場環境嚴峻），跳過 AI 盡調"
            # 不 exit 1，讓 workflow 綠燈結束
          else
            python news_sentiment.py
          fi
          
      - name: Commit Candidates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 🔴 P0 修正：0 候選時 news_sentiment.py 會被跳過，ai_dd_reports.json 不存在，
          # 直接 git add 不存在的 pathspec 會 exit 128 → commit/push 全滅 → 網站永遠收不到資料。
          # 改為條件式 add（與 #87 的 rebase＋重試模式一致）。
          [ -f data/screener_candidates.json ] && git add data/screener_candidates.json || echo "⚠️ 無 screener_candidates.json"
          [ -f data/ai_dd_reports.json ] && git add data/ai_dd_reports.json || echo "⚠️ 無 ai_dd_reports.json（0 候選屬正常）"
          git pull --rebase origin main || true
          git commit -m "🎯 Weekly Alpha Screener: $(date +'%Y-%m-%d')" || echo "No new candidates"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
