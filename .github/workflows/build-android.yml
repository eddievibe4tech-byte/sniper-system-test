name: Build Android APK

# 依「本地測試指南與 APK 自動產出 Workflow」建議完全重構（PR #142 後續調整）：
#   - NDK 改由 android-actions/setup-android@v3 直接安裝並鎖定 26.2.11394342 (r26b)
#     （取代 nttld/setup-ndk，避免 action 已漸趨維護停滯的問題）
#   - PR 走 static-check 快速反饋；Tag push / 手動觸發才做完整交叉編譯產出 APK
#   - gen/android 不入庫，CI 每次 cargo tauri android init 重建，驗證建置可重現性
#   - Keystore Secrets 有設定時自動啟用 release 簽名，未設定則跳過（開發期 debug 簽名）
#   - ⚠️ 依建議修正：Secrets 僅在默認分支 (main) 的運行中可見，PR 分支上的 workflow
#     修改無法完成簽名端到端驗證——因此 push 同時監聽 main 分支，合併後直接於 main
#     重跑簽名管線；正式可安裝 APK 仍以推 v* tag 產出 Release，
#     版本對照表與一鍵打 tag SOP 見 mobile/README.md「APK 版本發布流程」章節
on:
  push:
    branches:
      - main        # ⚠️ 必須保留：GitHub Secrets 僅在默認分支（main）的運行的環境
                    #    對非受信任分支不可見。若只在 tag/dispatch 觸發，PR 分支上的
                    #    workflow 修改永遠無法完成簽名端到端驗證——合併進 main 後
                    #    直接於 main 重跑本 workflow 即可驗證簽名管線。
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

# 🔑 Issue #147 第一步：GITHUB_TOKEN 預設唯讀，softprops/action-gh-release 建立
#    Release 會因無法寫入而失敗 (403 Forbidden)。contents 必須為 write。
permissions:
  contents: write   # 允許建立 Release 與上傳 APK Assets
  actions: read     # 保留讀取 workflow run 紀錄（Release notes 產生所需）

jobs:
  # ═══════════════════════════════════════════════════════
  # PR 快速反饋：不做 Android 交叉編譯，只跑 lint + typecheck
  # （push 到 main 時也先跑一輪靜態檢查作為守門）
  # ═══════════════════════════════════════════════════════
  static-check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Svelte typecheck
        run: npm run check

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev javascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./mobile/src-tauri -> target"
          cache-on-failure: "true"

      - name: Rust check & clippy
        working-directory: mobile/src-tauri
        run: |
          cargo check --target x86_64-unknown-linux-gnu
          cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

      # Rust 單元測試（webview_guard 等）——指南要求 merge 前 `cargo test --lib` 通過
      - name: Rust unit tests
        working-directory: mobile/src-tauri
        run: cargo test --lib

  # ═══════════════════════════════════════════════════════
  # 完整 APK 編譯（tag push / 手動觸發 / push 到 main）
  #   ⚠️ 依建議修正：GitHub Secrets 僅在默認分支 (main) 的運行中可見，
  #   PR 分支上的 workflow 修改看不到 Secrets、無法端到端驗證簽名管線。
  #   因此合併進 main 後直接於 main 重跑本 job 即可完成簽名驗證；
  #   Release 發佈步驟仍以 tag 觸發為限（见 Publish to GitHub Release 的 if）。
  # ═══════════════════════════════════════════════════════
  build-android:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # ── 前端 ──
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - run: npm ci

      - name: Svelte typecheck (sanity gate)
        run: npm run check

      # ── Java 17（Gradle 強制要求）──
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Rust ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      # ── Tauri Linux prerequisites ──
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev javascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: "true"

      # ── Android SDK + NDK（版本鎖定 r26b：Tauri 2.0 對 NDK 極度敏感）──
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;26.2.11394342

      - name: Set NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/26.2.11394342" >> $GITHUB_ENV

      # 🔑 關鍵（原指南保留）：Rust 交叉編譯需明確注入四目標的 Android C/C++ linker，
      #    minSdk=24 → linker 後綴 android24-clang。
      - name: Setup cross-compile linker environment
        run: |
          LLVM_BIN="${ANDROID_HOME}/ndk/26.2.11394342/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$LLVM_BIN/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$LLVM_BIN/i686-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$LLVM_BIN/x86_64-linux-android24-clang" >> $GITHUB_ENV

      # ── 初始化 Android 專案（gen/android 不入庫，每次重建以驗證可重現性）──
      - name: Init Tauri Android project
        run: cargo tauri android init

      # ── Issue #151：使用 release keystore 簽名（Secrets 未設定時自動跳過）──
      #    ⚠️ 修正既有 bug：TAURI_SIGNING_PRIVATE_KEY 是 Tauri **Updater** 的 minisign
      #    金鑰，與 APK 簽名無關；誤設不會產生 signed APK，只會造成混淆。
      #    Android APK 正式簽名的正確做法是把 keystore 寫進 Gradle Properties
      #    （cargo tauri android build 會以 -P 傳遞給 gen/android 的 signingConfig）。
      - name: Decode release keystore & wire Gradle signing (if secret set)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $GITHUB_WORKSPACE/mobile/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/mobile/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > $GITHUB_WORKSPACE/mobile/gradle.properties
          # Release 步驟以此旗標決定是否標為 Pre-release（未簽名＝測試版）
          echo "RELEASE_SIGNED=true" >> $GITHUB_ENV

      # ── 編譯 APK ──
      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: cargo tauri android build --apk

      # ── Issue #151：簽名驗證閘門（fail fast）──
      #    Secrets 已設定但產物仍是 unsigned（例如 keystore 密碼錯誤導致 Gradle
      #    靜默回退），必須讓 CI 紅燈，避免再發出「標記為正式版卻裝不了」的 Release。
      - name: Verify APK signature (fail-fast gate)
        if: env.RELEASE_SIGNED == 'true'
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::找不到 apksigner"; exit 1; }
          APK=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::找不到 release APK"; exit 1; }
          echo "驗證 $APK"
          "$APKSIGNER" verify --verbose "$APK" | tee /tmp/verify.log
          grep -q "Verified using v1 scheme" /tmp/verify.log || { echo "::error::APK 未通過簽名驗證"; exit 1; }

      # ── 上傳產物（Issue #147 第二步·新增步驟 1）──
      #    保留 Artifacts 供內部短期備份／手機測試（含手動觸發的測試版）
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sniper-mobile-${{ github.run_number }}
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
          # 注意：未簽名的 APK 會被 ColorOS (OPPO A5 Pro) 拒絕安裝；
          #       正式發布請先於 Repo Secrets 設定 KEYSTORE_BASE64 / KEYSTORE_PASSWORD。

      # ── 自動建立 GitHub Release 並掛載 APK（Issue #147 第二步·新增步驟 2）──
      #    僅在推 v* Tag 時發佈，保持 Release 版面乾淨：
      #    手動觸發 (workflow_dispatch) 只產出 Artifacts 供開發測試，不進 Release。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 匹配所有簽名與未簽名的 APK（release keystore 有設定時一併掛上）
          files: |
            mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          # 自動產生 Release Notes（包含 PR 合併紀錄）
          generate_release_notes: true
          # 🚨 找不到 APK 檔案則讓 CI 紅燈，避免發出「空包彈」Release
          fail_on_unmatched_files: true
          # 尚未設定 KEYSTORE_BASE64 時產出的是 Unsigned APK，ColorOS 會拒絕安裝。
          # 以獨立旗標 RELEASE_SIGNED 判定（於 keystore 解碼步驟寫入），
          # 未簽名版本一律標為 Pre-release。
          prerelease: ${{ env.RELEASE_SIGNED != 'true' }}
          body: |
            ## ⚠️ 安裝注意事項
            - 若本 Release 附帶之 APK 為 **Unsigned**（Repo 尚未設定 `KEYSTORE_BASE64` /
              `KEYSTORE_PASSWORD` Secrets），OPPO ColorOS 等系統將直接拒絕安裝，
              僅供開發除錯；正式安裝請改用本地 `cargo tauri android dev`（Debug 金鑰）。
            - 版本號對應：Tag 版本應與 `mobile/src-tauri/tauri.conf.json` 之 `version`
              欄位一致（推 tag 前請先更新，見 mobile/README.md SOP）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
