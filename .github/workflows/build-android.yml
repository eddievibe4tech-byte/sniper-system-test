name: Build Tauri Android APK

# 依「Rust + Tauri 2.0 Mobile 機構級 CI/CD 指南」實作：
#   - NDK 版本鎖定 r26b（Tauri 2.0 官方推薦穩定版，避免 90% 本地編譯地獄）
#   - Cargo Android 交叉編譯 Linker 路徑注入（成敗關鍵）
#   - 僅推 Tag (v*) 或手動觸發時編譯；PR 上僅跑 lint/typecheck（快速反饋）
on:
  push:
    tags:
      - 'v*' # 僅在推送 Tag（如 v1.0.0）時觸發完整 APK 編譯
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: read

jobs:
  # ── PR 快速反饋：不交叉編譯，只檢查 Rust/Svelte 可否通過 lint 與 typecheck ──
  static-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Svelte frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Svelte check (compile-time template errors)
        run: npm run check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust check & clippy (host target, no NDK needed)
        working-directory: mobile/src-tauri
        run: |
          cargo check --target x86_64-unknown-linux-gnu
          cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings

  # ── Tag / 手動觸發：完整的 Android APK 交叉編譯 ──
  build-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for Svelte frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install frontend dependencies
        working-directory: mobile
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java (Android Gradle requires JDK 17+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Tauri CLI
        working-directory: mobile
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b # Tauri 2.0 官方推薦的穩定版本（版本鎖是成敗關鍵）
          add-to-path: true

      - name: Setup Android environment variables
        # 🔑 關鍵：Rust 交叉編譯需要明確知道 Android 的 C/C++ 連結器位置。
        #    minSdk=24 → linker 後綴 android24-clang。
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$LLVM_BIN/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$LLVM_BIN/i686-linux-android24-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$LLVM_BIN/x86_64-linux-android24-clang" >> $GITHUB_ENV

      - name: Initialize Tauri Android project
        working-directory: mobile
        run: npx tauri android init --target aarch64 armv7 i686 x86_64

      - name: Build Android APK (Release, unsigned)
        working-directory: mobile
        run: npx tauri android build --apk

      # ── 簽名步驟（發布期）：GitHub Secrets 未設定時自動跳過，開發期用 debug keystore ──
      - name: Decode release keystore (if configured)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Sign APK with apksigner
        if: env.KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          mv mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/*release*.apk
          # 注意：未簽名的 APK 會被 ColorOS (OPPO A5 Pro) 拒絕安裝；
          #       正式發布請先設定上述 keystore Secrets。
