name: Build Tauri Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write   # Release 發佈需要；其餘 job 不受影響

jobs:
  # ═══ PR / main 推送：快速靜態檢查 ═══
  static-check:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json
      - run: npm ci
      - name: Svelte typecheck
        run: npm run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev javascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./mobile/src-tauri -> target"
          cache-on-failure: "true"
      - name: Rust check & clippy
        working-directory: mobile/src-tauri
        run: |
          cargo check --target x86_64-unknown-linux-gnu
          cargo clippy --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Rust unit tests
        working-directory: mobile/src-tauri
        run: cargo test --lib

  # ═══ 完整 APK 編譯＋簽名＋Release ═══
  build-android:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 🚀 優化 1：只編譯 ARM64（砍掉 75% 交叉編譯時間）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # 🚀 優化 2：Tauri CLI 改用 npm 預編譯二進位（比 cargo install 快 5-10 分鐘）
      - name: Install Tauri CLI (prebuilt)
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev javascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: "true"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            ndk;26.2.11394342

      - name: Set NDK_HOME and linker
        run: |
          LLVM_BIN="${ANDROID_HOME}/ndk/26.2.11394342/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV

      - name: Init Tauri Android project
        run: npx tauri android init

      - name: Build Android APK (aarch64 only)
        run: npx tauri android build --apk --target aarch64

      # 🔑 修正 1：if 直接讀 secrets context（step 級 env 在自己的 if 中讀不到，
      #    舊寫法導致此步驟永遠 skipped）
      # 🔑 修正 2：編譯後用 apksigner 後置簽名，繞開 Gradle 讀不到外層
      #    gradle.properties 的問題
      # 🔑 修正 3：用 find 定位 APK（單目標編譯產出在 arm64/ 而非 universal/）
      - name: Sign APK with apksigner (post-sign)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk \
                         -name "*-release-unsigned.apk" | head -1)
          [ -n "$UNSIGNED_APK" ] || { echo "::error::找不到 unsigned APK"; exit 1; }
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # 驗證（minSdk 24 只用 v2 scheme，勿再 grep v1；以 exit code 為準）
          "$APKSIGNER" verify --print-certs "$SIGNED_APK"

          rm -f "$UNSIGNED_APK"          # Release 只留可安裝版本
          echo "APK_SIGNED=true" >> $GITHUB_ENV

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sniper-mobile-${{ github.run_number }}
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ env.APK_SIGNED != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
